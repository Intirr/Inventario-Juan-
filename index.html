<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escáner de Asistencia — Carnet</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --primary: #1a56db;
    --primary-dark: #1240a8;
    --success: #057a55;
    --danger: #c81e1e;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header p { font-size: .8rem; opacity: .85; margin-top: 2px; }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .card h2 {
    font-size: 1rem;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* ---- cámara ---- */
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
  }
  .camera-wrap video, .camera-wrap canvas.preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .guide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .guide-box {
    width: 85%;
    aspect-ratio: 1.586; /* proporción de un carnet ISO ID-1 */
    border: 3px dashed rgba(255,255,255,.85);
    border-radius: 12px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
  }
  .guide-text {
    position: absolute;
    bottom: 10px;
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: .8rem;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 130px;
    padding: 13px 16px;
    border: none;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-secondary { background: var(--border); color: var(--text); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger-outline {
    background: transparent;
    color: var(--danger);
    border: 1.5px solid var(--danger);
  }
  /* ---- estado / resultado ---- */
  .status {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 10px;
    font-size: .9rem;
    margin-top: 12px;
  }
  .status.show { display: flex; }
  .status.processing { background: #eff6ff; color: var(--primary); }
  .status.error { background: #fef2f2; color: var(--danger); }
  .spinner {
    width: 18px; height: 18px;
    border: 3px solid #bfdbfe;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: #dbeafe;
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    width: 0%;
    background: var(--primary);
    transition: width .2s;
  }
  .confirm-box {
    display: none;
    margin-top: 12px;
    padding: 14px;
    border: 2px solid var(--success);
    border-radius: 10px;
    background: #f0fdf4;
  }
  .confirm-box.show { display: block; }
  .confirm-box .label { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  .confirm-box input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1.05rem;
    font-weight: 700;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    text-transform: uppercase;
  }
  .confirm-box .hint { font-size: .75rem; color: var(--muted); margin-top: 6px; }
  /* ---- lista ---- */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .badge {
    background: var(--primary);
    color: #fff;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: .85rem;
    font-weight: 700;
  }
  ul.attendance { list-style: none; }
  ul.attendance li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--border);
    font-size: .92rem;
  }
  ul.attendance li:last-child { border-bottom: none; }
  ul.attendance .name { font-weight: 600; }
  ul.attendance .time { color: var(--muted); font-size: .8rem; white-space: nowrap; }
  ul.attendance .remove {
    flex: 0;
    min-width: auto;
    padding: 4px 10px;
    font-size: .8rem;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: .9rem; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--text);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: .9rem;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    transition: transform .3s;
    z-index: 100;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.warn { background: #b45309; }
  .file-fallback { display: none; }
</style>
</head>
<body>

<header>
  <h1>📋 Escáner de Asistencia</h1>
  <p>Fotografía el carnet para registrar la entrada</p>
</header>

<main>
  <!-- Cámara -->
  <section class="card">
    <h2>📷 Escanear carnet</h2>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="previewCanvas" class="preview" style="display:none"></canvas>
      <div class="guide" id="guide">
        <div class="guide-box"></div>
        <div class="guide-text">Coloca el carnet dentro del recuadro</div>
      </div>
    </div>

    <div class="btn-row">
      <button id="btnCapture" class="btn-primary">📸 Tomar foto</button>
      <button id="btnRetake" class="btn-secondary" style="display:none">🔄 Repetir</button>
      <button id="btnUpload" class="btn-secondary">🖼️ Subir imagen</button>
    </div>
    <input type="file" id="fileInput" class="file-fallback" accept="image/*" capture="environment">

    <div class="status processing" id="statusProcessing">
      <div class="spinner"></div>
      <span>Leyendo el carnet…</span>
      <div class="progress-bar"><div id="progressFill"></div></div>
    </div>
    <div class="status error" id="statusError">
      <span id="errorMsg"></span>
    </div>

    <div class="confirm-box" id="confirmBox">
      <div class="label">Nombre detectado — corrígelo si es necesario:</div>
      <input type="text" id="nameInput" autocomplete="off">
      <div class="btn-row">
        <button id="btnRegister" class="btn-success">✅ Registrar presente</button>
        <button id="btnCancel" class="btn-secondary">Cancelar</button>
      </div>
      <div class="hint">Verifica que el nombre sea correcto antes de registrar.</div>
    </div>
  </section>

  <!-- Lista de asistencia -->
  <section class="card">
    <div class="list-header">
      <h2 style="margin:0">✅ Presentes hoy <span class="badge" id="countBadge">0</span></h2>
    </div>
    <ul class="attendance" id="attendanceList"></ul>
    <div class="empty" id="emptyMsg">Aún no hay registros hoy.</div>
    <div class="btn-row">
      <button id="btnExport" class="btn-primary">⬇️ Exportar CSV</button>
      <button id="btnClear" class="btn-danger-outline">🗑️ Vaciar lista de hoy</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const video = $('video');
  const previewCanvas = $('previewCanvas');
  const guide = $('guide');
  const btnCapture = $('btnCapture');
  const btnRetake = $('btnRetake');
  const btnUpload = $('btnUpload');
  const fileInput = $('fileInput');
  const statusProcessing = $('statusProcessing');
  const statusError = $('statusError');
  const errorMsg = $('errorMsg');
  const progressFill = $('progressFill');
  const confirmBox = $('confirmBox');
  const nameInput = $('nameInput');
  const btnRegister = $('btnRegister');
  const btnCancel = $('btnCancel');
  const attendanceList = $('attendanceList');
  const emptyMsg = $('emptyMsg');
  const countBadge = $('countBadge');
  const toast = $('toast');
  const btnExport = $('btnExport');
  const btnClear = $('btnClear');

  const STORAGE_KEY = 'asistencia_registros';
  let stream = null;
  let worker = null;
  let ocrBusy = false;

  /* ---------- utilidades ---------- */

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function loadRecords() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function todayRecords() {
    return loadRecords().filter(r => r.date === todayKey());
  }

  let toastTimer = null;
  function showToast(msg, type = 'success') {
    toast.textContent = msg;
    toast.className = `toast show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function normalizeName(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ').trim().toUpperCase();
  }

  /* ---------- cámara ---------- */

  async function startCamera() {
    stopCamera();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      video.style.display = 'block';
      previewCanvas.style.display = 'none';
      guide.style.display = 'flex';
      btnCapture.style.display = 'block';
      btnRetake.style.display = 'none';
    } catch (err) {
      showError('No se pudo acceder a la cámara. Usa el botón "Subir imagen" o revisa los permisos.');
      btnCapture.disabled = true;
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  function showPreview(drawFn) {
    const ctx = previewCanvas.getContext('2d');
    drawFn(ctx);
    video.style.display = 'none';
    guide.style.display = 'none';
    previewCanvas.style.display = 'block';
    btnCapture.style.display = 'none';
    btnRetake.style.display = 'block';
  }

  /* ---------- OCR ---------- */

  async function getWorker() {
    if (worker) return worker;
    worker = await Tesseract.createWorker('spa', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          progressFill.style.width = `${Math.round(m.progress * 100)}%`;
        }
      }
    });
    return worker;
  }

  function hideStatuses() {
    statusProcessing.classList.remove('show');
    statusError.classList.remove('show');
    confirmBox.classList.remove('show');
  }

  function showError(msg) {
    hideStatuses();
    errorMsg.textContent = msg;
    statusError.classList.add('show');
  }

  async function runOCR(canvas) {
    if (ocrBusy) return;
    ocrBusy = true;
    hideStatuses();
    progressFill.style.width = '0%';
    statusProcessing.classList.add('show');
    btnRegister.disabled = false;
    try {
      const w = await getWorker();
      const { data } = await w.recognize(canvas);
      const name = extractName(data);
      hideStatuses();
      if (name) {
        nameInput.value = name;
        confirmBox.classList.add('show');
        nameInput.focus();
      } else {
        showError('No se pudo detectar un nombre. Intenta de nuevo con mejor luz y el carnet dentro del recuadro.');
      }
    } catch (err) {
      showError('Error al procesar la imagen: ' + (err.message || err));
    } finally {
      ocrBusy = false;
    }
  }

  /* ---------- extracción del nombre ----------
     Solo nos interesa el nombre: se ignora número de documento,
     fechas, cargo y cualquier otro dato del carnet. */

  const LABEL_RE = /(NOMBRES?|APELLIDOS?\s*Y\s*NOMBRES?|NOMBRE\s*COMPLETO|APELLIDOS?)\s*[:.\-]?\s*(.*)/i;
  const STOPWORDS = /\b(REPUBLICA|IDENTIDAD|IDENTIFICACION|DOCUMENTO|NACIONAL|CEDULA|CARNET|CARNE|TARJETA|EMPRESA|EMPLEADO|CARGO|FECHA|NACIMIENTO|EXPEDICION|VENCIMIENTO|SANGRE|DIRECCION|TELEFONO|FIRMA|SEXO|ESTATURA|GEREN|DEPARTAMENTO|CODIGO|No\.?|NUM|RH)\b/i;

  function cleanLine(line) {
    // deja solo letras (incluye acentos y Ñ), espacios, apóstrofes y guiones
    return line.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ'\- ]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function looksLikeName(line) {
    const c = cleanLine(line);
    if (!c) return false;
    const words = c.split(' ').filter(w => w.length >= 2);
    if (words.length < 2 || words.length > 6) return false;
    if (STOPWORDS.test(c)) return false;
    // los nombres en carnets suelen venir en mayúsculas
    const upperRatio = (c.replace(/[^A-ZÁÉÍÓÚÜÑ]/g, '').length) / (c.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, '').length || 1);
    return upperRatio > 0.7;
  }

  function extractName(data) {
    const lines = (data.lines || []).map(l => l.text.trim()).filter(Boolean);

    // 1) Buscar etiquetas tipo "NOMBRES:" / "APELLIDOS:" — el valor puede
    //    estar en la misma línea o en la siguiente.
    const parts = [];
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(LABEL_RE);
      if (m) {
        let value = cleanLine(m[2] || '');
        if (!value && lines[i + 1] && looksLikeName(lines[i + 1])) {
          value = cleanLine(lines[i + 1]);
          i++;
        }
        if (value && !STOPWORDS.test(value)) parts.push(value);
      }
    }
    if (parts.length) return normalizeName(parts.join(' ')).slice(0, 60);

    // 2) Sin etiquetas: tomar las líneas que parecen un nombre y elegir
    //    la de mayor confianza/longitud razonable.
    const candidates = lines.filter(looksLikeName).map(cleanLine);
    if (candidates.length) {
      candidates.sort((a, b) => b.length - a.length);
      // si hay dos candidatas contiguas (apellidos + nombres) únelas
      return normalizeName(candidates.slice(0, 2).join(' ')).slice(0, 60);
    }
    return null;
  }

  /* ---------- registro ---------- */

  function renderList() {
    const records = todayRecords();
    attendanceList.innerHTML = '';
    countBadge.textContent = records.length;
    emptyMsg.style.display = records.length ? 'none' : 'block';
    records.slice().reverse().forEach(r => {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = r.time;
      const btn = document.createElement('button');
      btn.className = 'remove';
      btn.textContent = '✕';
      btn.title = 'Eliminar registro';
      btn.onclick = () => removeRecord(r.id);
      li.append(name, time, btn);
      attendanceList.appendChild(li);
    });
  }

  function registerPresent() {
    const name = normalizeName(nameInput.value);
    if (name.length < 3) {
      showToast('Escribe un nombre válido.', 'warn');
      return;
    }
    const records = loadRecords();
    const dup = records.find(r => r.date === todayKey() && r.name === name);
    if (dup) {
      showToast(`${name} ya fue registrado hoy a las ${dup.time}.`, 'warn');
      resetToCamera();
      return;
    }
    const now = new Date();
    records.push({
      id: Date.now(),
      name,
      date: todayKey(),
      time: now.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
    });
    saveRecords(records);
    renderList();
    showToast(`✅ ${name} registrado como presente.`);
    resetToCamera();
  }

  function removeRecord(id) {
    saveRecords(loadRecords().filter(r => r.id !== id));
    renderList();
  }

  function resetToCamera() {
    hideStatuses();
    nameInput.value = '';
    startCamera();
  }

  /* ---------- exportar CSV ---------- */

  function exportCSV() {
    const records = todayRecords();
    if (!records.length) {
      showToast('No hay registros para exportar.', 'warn');
      return;
    }
    const rows = [['Nombre', 'Fecha', 'Hora']]
      .concat(records.map(r => [r.name, r.date, r.time]));
    const csv = rows.map(row =>
      row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
    ).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `asistencia_${todayKey()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  /* ---------- eventos ---------- */

  btnCapture.addEventListener('click', () => {
    if (!stream) return;
    previewCanvas.width = video.videoWidth;
    previewCanvas.height = video.videoHeight;
    showPreview(ctx => ctx.drawImage(video, 0, 0));
    stopCamera();
    runOCR(previewCanvas);
  });

  btnRetake.addEventListener('click', resetToCamera);

  btnUpload.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      previewCanvas.width = img.naturalWidth;
      previewCanvas.height = img.naturalHeight;
      showPreview(ctx => ctx.drawImage(img, 0, 0));
      stopCamera();
      runOCR(previewCanvas);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    fileInput.value = '';
  });

  btnRegister.addEventListener('click', registerPresent);
  btnCancel.addEventListener('click', resetToCamera);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') registerPresent(); });

  btnExport.addEventListener('click', exportCSV);
  btnClear.addEventListener('click', () => {
    if (!todayRecords().length) return;
    if (confirm('¿Vaciar la lista de asistencia de hoy? Esta acción no se puede deshacer.')) {
      saveRecords(loadRecords().filter(r => r.date !== todayKey()));
      renderList();
      showToast('Lista de hoy vaciada.');
    }
  });

  /* ---------- inicio ---------- */
  renderList();
  startCamera();
})();
</script>
</body>
</html>
